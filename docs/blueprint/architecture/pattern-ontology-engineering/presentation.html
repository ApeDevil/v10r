<template id="t-slice2"><section>
  <div class="eyebrow">Slice 2 · entity kinds, record reconciliation, identifiers · checkpoint</div>
  <h2>Every record says what adopting it means, and every id names its concept.</h2>
  <p>Slice 1's review items are fixed first: name check is split into the reusable aggregation mechanism and the protected public endpoint (whose fail-closed limiter keeps the key-value store required), hosted MCP keeps its four concerns apart, need merging has regression fixtures, and the benchmark scores need levels. Then 143 records were renamed, merged, retired or split under a manifest whose gate proves no knowledge was lost and no old id survives.</p>
  <div class="grid">
    <div class="panel stat"><b>199 → 170</b><span>records; 163 pattern, 4 workflow, 3 principle</span></div>
    <div class="panel stat"><b>149 → 11</b><span>ids starting with a taxonomy prefix (rest are concept names or the deferred Desk)</span></div>
    <div class="panel stat"><b>143</b><span>manifest entries, each checked for lost refs, invariants, contraindications, alternatives, needs, evidence</span></div>
    <div class="panel stat"><b>71.4%</b><span>need level accuracy, 20 scenarios (baseline rescored 40%)</span></div>
    <div class="panel stat"><b>100%</b><span>complete capability coverage against the current benchmark</span></div>
    <div class="panel stat"><b>0</b><span>regressions; 4 downgrades all from unselected steps (Slice 4)</span></div>
  </div>

<template id="t-slice1"><section>
  <div class="eyebrow">Slice 1 · benchmark baseline and truthful infrastructure facts · checkpoint</div>
  <h2>The facts are complete. Selection is next.</h2>
  <p>Every record now states its infrastructure needs by level (required, conditional, optional, implementation), checked against the adapters its code imports. Given the right steps, the registry names every need the golden sets expect, in design and holdout alike. What still goes wrong is which steps the planner picks, which Slice 4 changes.</p>
  <div class="grid">
    <div class="panel stat"><b>76.7%</b><span>need recall, 18 scenarios (was 53.3%)</span></div>
    <div class="panel stat"><b>100%</b><span>fact need recall: complete capability coverage against the current benchmark (was 43.3%)</span></div>
    <div class="panel stat"><b>0</b><span>records importing an adapter they do not declare</span></div>
    <div class="panel stat"><b>0</b><span>node-kind need contradictions (was 11)</span></div>
    <div class="panel stat"><b>145</b><span>titles made canonical, 0 volatile numerals</span></div>
    <div class="panel stat"><b>+9.8%</b><span>plan tokens (target ≤ +10%)</span></div>
  </div>
  <div class="filters" id="bfilters" role="group" aria-label="Scenario set"></div>
  <div class="panel scroll"><table><thead><tr><th>Metric</th><th class="num">Baseline</th><th class="num">Slice 1</th><th>Reading</th></tr></thead><tbody id="btable"></tbody></table></div>
  <div class="panel"><h3>Ruled 2026-11-28 (resolved in Slice 2)</h3><ul style="margin:6px 0 0;padding-left:20px">
    <li><b>S3 golden correction:</b> hosted MCP authenticates with environment tokens, so <code>relational-db</code> is implementation level there. Recorded with its reason; confirm or overrule.</li>
    <li><b>S8 levels:</b> <code>name-check</code> declares its database and key-value store as conditional; the golden set says required.</li>
    <li><b>Spurious needs 5 → 8:</b> all from steps the planner should not have picked, now visible because their needs are truthful.</li>
    <li><b>Maturity warnings:</b> 13 "promote to proven" warnings remain, the rule D-08 rejects; Slice 5 replaces it.</li>
  </ul></div>
</section></template>

<template id="t-overview"><section>
  <div class="eyebrow">Pattern Ontology Engineering · review accepted 2026-11-28 · Slice 1 accepted · Slice 2 implemented, awaiting review</div>
  <h1>The registry is sound. Its relationships are not typed.</h1>
  <p class="panel" style="margin-bottom:12px"><b>Status:</b> ApeDevil accepted the review and ruled on all 14 decisions. Slice 1 (benchmark baseline, truthful infrastructure needs, canonical titles) is accepted; Slice 2 (entity kinds, record reconciliation, identifiers) is on the branch and stopped at its checkpoint; see <a href="#slice2">Slice 2 result</a>. The figures below are the review baseline, measured before Slice 1.</p>
  <p>One authority in git, deterministic tools, fail-closed gates and fitness before the how are worth keeping. But one untyped <code>depends_on</code> carries five meanings, every light record omits its infrastructure, documentation depth decides what a plan may contain, and most "proven" grades come from one bulk stamp. On eight emulation scenarios, plans were 48% precise and found 56% of the infrastructure they need.</p>
  <div class="grid">
    <div class="panel stat"><b>199</b><span>records · 63 deep · 136 light</span></div>
    <div class="panel stat"><b>29 / 88</b><span>edges that are real prerequisites</span></div>
    <div class="panel stat"><b>≥ 54</b><span>records missing infrastructure needs</span></div>
    <div class="panel stat"><b>124 / 173</b><span>"proven" from one 2026-08-20 stamp</span></div>
    <div class="panel stat"><b>48%</b><span>plan step precision (8 scenarios)</span></div>
    <div class="panel stat"><b>56%</b><span>required infrastructure found</span></div>
  </div>
  <div class="panel"><h3>Recommendation</h3><p style="margin-top:6px">Keep the registry as the only authority and type it: <code>builds_on</code>, <code>composes</code> (optional with a condition), <code>specializes</code>; a closed <code>kind</code>; capability-level infrastructure needs; maturity derived from evidence; scoped platform assumptions. No database or graph-store projection. Eight slices, each ending at a review checkpoint.</p></div>
</section></template>

  <div class="eyebrow">C · target ontology · direction B</div>
  <h2>Three typed relationships, derived inverses</h2>
  <div class="panel scroll"><table>
    <thead><tr><th></th><th>builds_on</th><th>composes</th><th>specializes</th></tr></thead>

      <tr><th>Inverse</th><td>built on by</td><td>part of</td><td>specialized by</td></tr>
      <tr><th>Cardinality</th><td>0..n</td><td>0..n, <code>{id, optional, when}</code></td><td>0..1</td></tr>
      <tr><th>Cycles</th><td colspan="3">forbidden over the union of all three</td></tr>

      <tr><th>Edges today</th><td class="num">29</td><td class="num">26 + 8 optional</td><td class="num">4</td></tr>
    </tbody></table></div>
  <div class="two">

      <li>Platform baseline <code>assumes</code>, printed once per plan</li>
      <li>Infrastructure needs as capabilities with v10r bindings (relational-db → PostgreSQL)</li>
      <li>Typed <code>evidence</code>; maturity derived: proven · demonstrated · implemented · planned</li>

 roadmap(){$("#slices").innerHTML=SLICES.map(s=>`<div class="slice"><div class="n">S${s[0]}</div><div><h3>${esc(s[1])}</h3><p style="margin-top:4px">${esc(s[2])}</p></div></div>`).join("")},
 decisions(){$("#dtable").innerHTML=DECISIONS.map(d=>`<tr><td class="mono">${d[0]}</td><td>${esc(d[1])}</td><td>${esc(d[2])}</td><td><span class="pill ${d[3]==="evidence"?"good":d[3]==="both"?"low":"medium"}">${d[3]}</span></td></tr>`).join("")}
};
const VIEWS=["overview","slice2","slice1","current","edges","findings","proposed","composition","plans","records","alignment","roadmap","decisions"];
function show(){const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"overview";$("#main").replaceChildren($(`#t-${v}`).content.cloneNode(true));setup[v]?.();document.querySelectorAll("nav a").forEach(a=>{a.setAttribute("aria-current",String(a.getAttribute("href")===`#${v}`))});}
addEventListener("hashchange",show);show();
