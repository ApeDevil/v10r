# Expected failures for the official MCP conformance suite, revision 2026-07-28
# (runner @modelcontextprotocol/conformance@0.2.0-alpha.12 with --requirements 2026-07-28, pinned in
# scripts/mcp/conformance.ts). Entries are per CHECK (scenario:check-id), not per scenario, so a new
# failing check inside a partly-passing scenario still fails the run.
#
# Fixture entries became visible on 2026-11-21, when an unknown tool turned into the spec's -32602:
# until then the runner read v10r's `isError` "Unknown tool" result as the fixture answering, so
# tools-call-simple-text, tools-call-error and two server-stateless checks passed without testing
# anything. Those passes were false; the entries below say so.
#
# Every entry exercises a capability or extension v10r does not advertise — `server/discover` declares
# `capabilities: { tools: { listChanged: false } }` and nothing else — or a fixture tool from the
# conformance reference server that a real server has no reason to expose. Nothing here is a protocol
# bug: every server-stateless check that needs no fixture, http-header-validation, tools-list,
# dns-rebinding-protection and the caching hints on server/discover and tools/list all pass. A new
# failure is never added here without a matrix row (docs/blueprint/architecture/mcp-evolution/matrix.md)
# saying why it is not applicable.
