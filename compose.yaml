# Development environment for Velociraptor
# Usage: podman compose up

name: v10r

services:
  app:
    image: v10r
    container_name: v10r
    build:
      context: .
      dockerfile: Containerfile.dev
    ports:
      - "5173:5173"   # Vite dev server
    volumes:
      - .:/app                       # Mount project for hot reload
      - node_modules:/app/node_modules  # Persist deps in named volume
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - CONTAINER=1
      # The client build's transform phase peaks near 5 GB; V8's default old-space cap (~4 GB)
      # dies there with "Reached heap limit". A cap, not an allocation — idle processes stay small.
      - NODE_OPTIONS=--max-old-space-size=12288

  # The External Service Lab's reference service (services/runtime-lab, Rust/Axum).
  # Optional and separate: it sits behind a profile, so plain `podman compose up` never
  # builds or starts it. Start it with:
  #   podman compose --profile external-service up -d runtime-lab
  # The app reaches it on the compose network as http://runtime-lab:8080 (set
  # EXTERNAL_SERVICE_LOCAL_URL to that in .env); 127.0.0.1:8787 is for curl and verify.ts.
  # Build context is the service directory only — the same Containerfile Render builds.
  runtime-lab:
    profiles: ["external-service"]
    container_name: v10r-runtime-lab
    build:
      context: services/runtime-lab
      dockerfile: Containerfile
    ports:
      - "127.0.0.1:8787:8080"
    # The process needs nothing from the container but a socket: no writable filesystem,
    # no capabilities, no privilege gain. Resources stay unlimited for development — the
    # free-tier envelope (0.1 CPU, 512 MB) is a measurement, scripts/external-service/bench.sh.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      - PORT=8080
      # Same credential the app sends; read from .env by compose interpolation.
      - SERVICE_TOKEN=${EXTERNAL_SERVICE_LOCAL_TOKEN:-}
      # Only during a rotation: the credential being retired, still accepted.
      - SERVICE_TOKEN_PREVIOUS=${EXTERNAL_SERVICE_LOCAL_TOKEN_PREVIOUS:-}

volumes:
  node_modules:  # Named volume keeps deps off your host system
