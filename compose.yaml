# Development environment for Velociraptor
# Usage: podman compose up

name: v10r

services:
  app:
    image: v10r
    container_name: v10r
    build:
      context: .
      dockerfile: Containerfile.dev
    ports:
      - "5173:5173"   # Vite dev server
    volumes:
      - .:/app                       # Mount project for hot reload
      - node_modules:/app/node_modules  # Persist deps in named volume
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - CONTAINER=1
      # The client build's transform phase peaks near 5 GB; V8's default old-space cap (~4 GB)
      # dies there with "Reached heap limit". A cap, not an allocation — idle processes stay small.
      - NODE_OPTIONS=--max-old-space-size=12288

volumes:
  node_modules:  # Named volume keeps deps off your host system
